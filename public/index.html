<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerCopilot - 职业路径参照系</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.35s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <header class="bg-white border-b">
        <div class="max-w-4xl mx-auto px-4 py-5">
            <h1 class="text-2xl font-bold">CareerCopilot</h1>
            <p class="text-sm text-slate-500">基于证据的中文职业轨迹参照系</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <section class="bg-white rounded-xl shadow-sm p-5 mb-4">
            <div class="flex flex-col sm:flex-row sm:items-center gap-3">
                <label for="access-mode" class="text-sm font-medium">访问模式</label>
                <select id="access-mode" class="border rounded-lg px-3 py-2 text-sm">
                    <option value="demo">只读演示</option>
                    <option value="authenticated">已登录用户</option>
                </select>
                <div id="token-row" class="hidden flex-1">
                    <label for="bearer-token" class="sr-only">访问令牌</label>
                    <input id="bearer-token" type="password" autocomplete="off"
                        class="w-full border rounded-lg px-3 py-2 text-sm"
                        placeholder="粘贴短期 Bearer Token（仅保存在本页内存）">
                </div>
            </div>
            <p id="mode-note" class="mt-3 text-sm text-amber-700" role="status">
                当前为只读演示：不读取、不保存个人画像、简历或会话记忆。
            </p>
        </section>

        <section class="bg-white rounded-xl shadow-sm p-6 mb-5">
            <div class="grid sm:grid-cols-2 gap-4">
                <div>
                    <label for="current-occupation" class="block text-sm font-medium mb-2">
                        当前职业或专业方向
                    </label>
                    <input id="current-occupation" class="w-full border rounded-lg p-3"
                        placeholder="例如：土地资源管理">
                </div>
                <div>
                    <label for="target-occupation" class="block text-sm font-medium mb-2">
                        想了解的目标职业（可选）
                    </label>
                    <input id="target-occupation" class="w-full border rounded-lg p-3"
                        placeholder="例如：产品经理">
                </div>
            </div>
            <button id="submit-btn"
                class="mt-4 w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50">
                查看职业路径证据
            </button>
        </section>

        <div id="loading" class="hidden text-center py-10" role="status">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <p class="mt-3 text-slate-500">正在读取结构化证据...</p>
        </div>

        <div id="error" class="hidden bg-red-50 border border-red-200 rounded-xl p-5 text-red-700 mb-5"
            role="alert"></div>

        <section id="demo-result" class="hidden fade-in bg-amber-50 border border-amber-200 rounded-xl p-6 mb-5">
            <h2 class="font-bold text-amber-900 mb-2">只读演示</h2>
            <p id="demo-text" class="text-amber-900 leading-relaxed"></p>
        </section>

        <section id="contract-result" class="hidden fade-in space-y-4">
            <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <h2 class="text-lg font-bold">API v2 结果</h2>
                    <span id="response-status" class="text-sm px-3 py-1 rounded-full"></span>
                </div>
                <p id="response-meta" class="mt-2 text-xs text-slate-500"></p>
            </div>

            <div id="coverage-card" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-6">
                <h3 class="font-bold text-amber-900 mb-2">当前数据不足</h3>
                <ul id="coverage-list" class="list-disc pl-5 text-sm text-amber-900 space-y-1"></ul>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-6">
                <h3 class="font-bold mb-3">候选路径</h3>
                <div id="paths-list" class="space-y-3"></div>
                <p id="paths-empty" class="text-sm text-slate-500">
                    尚无满足证据门禁的候选路径。
                </p>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-6">
                <h3 class="font-bold mb-3">证据与来源</h3>
                <div id="evidence-list" class="space-y-3"></div>
                <p id="evidence-empty" class="text-sm text-slate-500">
                    尚无可引用证据。
                </p>
            </div>

            <details class="bg-slate-100 rounded-xl p-4">
                <summary class="text-sm text-slate-600 cursor-pointer">结构化响应（调试）</summary>
                <pre id="raw-response" class="mt-3 text-xs whitespace-pre-wrap overflow-x-auto"></pre>
            </details>
        </section>
    </main>

    <footer class="text-center text-xs text-slate-400 py-6">
        CareerCopilot · V2 Evidence-first
    </footer>

    <script src="./navigation-contract.js"></script>
    <script>
    const RUNTIME_CONFIG = Object.freeze(window.CAREERCOPILOT_CONFIG || {});
    const API_BASE = String(RUNTIME_CONFIG.apiBase || window.location.origin)
        .replace(/\/$/, '');
    let sessionId = createClientSessionId();

    function createClientSessionId() {
        return (typeof crypto.randomUUID === 'function')
            ? crypto.randomUUID()
            : 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function occupationId(name) {
        return `input:${name.trim().toLowerCase().replaceAll(' ', '-')}`;
    }

    function clearNode(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
    }

    function textElement(tag, text, className = '') {
        const node = document.createElement(tag);
        node.textContent = text;
        if (className) node.className = className;
        return node;
    }

    function updateModeUI() {
        const authenticated = document.getElementById('access-mode').value === 'authenticated';
        document.getElementById('token-row').classList.toggle('hidden', !authenticated);
        document.getElementById('mode-note').textContent = authenticated
            ? '已登录模式：使用服务端签发的短期令牌；所有会话由后端绑定到当前用户。'
            : '当前为只读演示：不读取、不保存个人画像、简历或会话记忆。';
        sessionId = createClientSessionId();
    }

    function setBusy(busy) {
        const button = document.getElementById('submit-btn');
        button.disabled = busy;
        button.textContent = busy ? '读取中...' : '查看职业路径证据';
        document.getElementById('loading').classList.toggle('hidden', !busy);
    }

    function showError(message) {
        const error = document.getElementById('error');
        error.textContent = message;
        error.classList.remove('hidden');
    }

    async function readJson(response) {
        try {
            return await response.json();
        } catch (_error) {
            throw new Error(`服务返回了非 JSON 响应（HTTP ${response.status}）`);
        }
    }

    async function submitQuestion() {
        const currentName = document.getElementById('current-occupation').value.trim();
        const targetName = document.getElementById('target-occupation').value.trim();
        const mode = document.getElementById('access-mode').value;
        const token = document.getElementById('bearer-token').value.trim();

        document.getElementById('error').classList.add('hidden');
        document.getElementById('demo-result').classList.add('hidden');
        document.getElementById('contract-result').classList.add('hidden');

        if (!currentName) {
            showError('请先填写当前职业或专业方向。');
            return;
        }
        if (!API_BASE || API_BASE === 'null') {
            showError('未配置后端地址。请通过 CAREERCOPILOT_CONFIG.apiBase 注入部署地址。');
            return;
        }
        if (mode === 'authenticated' && !token) {
            showError('已登录模式需要有效的短期访问令牌。');
            return;
        }

        setBusy(true);
        try {
            if (mode === 'demo') {
                await submitDemo(currentName, targetName);
            } else {
                await submitAuthenticated(currentName, targetName, token);
            }
        } catch (error) {
            showError(`请求失败：${error.message}`);
        } finally {
            setBusy(false);
        }
    }

    async function submitDemo(currentName, targetName) {
        const headers = {'Content-Type': 'application/json'};
        const question = targetName
            ? `我目前是${currentName}，想了解${targetName}的职业路径`
            : `我目前是${currentName}，想了解职业发展路径`;
        const payload = {
            input: [{role: 'user', content: [{type: 'text', text: question}]}],
            session_id: sessionId
        };
        payload.mode = 'demo';

        const response = await fetch(`${API_BASE}/process`, {
            method: 'POST',
            headers,
            body: JSON.stringify(payload)
        });
        const data = await readJson(response);
        if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
        if (data.mode !== 'demo') throw new Error('后端未确认只读演示模式');
        if (typeof data.session_id === 'string' && data.session_id) {
            sessionId = data.session_id;
        }
        document.getElementById('demo-text').textContent =
            data.output?.[0]?.content?.[0]?.text || '暂无演示内容。';
        document.getElementById('demo-result').classList.remove('hidden');
    }

    async function submitAuthenticated(currentName, targetName, token) {
        const headers = {'Content-Type': 'application/json'};
        headers.Authorization = `Bearer ${token}`;
        const payload = {
            current_occupation: {
                occupation_id: occupationId(currentName),
                name: currentName
            },
            target_occupation: targetName ? {
                occupation_id: occupationId(targetName),
                name: targetName
            } : null
        };
        const response = await fetch(`${API_BASE}/api/v2/navigation`, {
            method: 'POST',
            headers,
            body: JSON.stringify(payload)
        });
        const data = await readJson(response);
        if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
        window.CareerNavigationContract.validateNavigationResponse(data);
        renderNavigationResponse(data);
    }

    function renderNavigationResponse(response) {
        const status = document.getElementById('response-status');
        status.textContent = window.CareerNavigationContract.statusLabel(response.status);
        status.className = response.status === 'ok'
            ? 'text-sm px-3 py-1 rounded-full bg-green-100 text-green-800'
            : response.status === 'data_insufficient'
                ? 'text-sm px-3 py-1 rounded-full bg-amber-100 text-amber-800'
                : 'text-sm px-3 py-1 rounded-full bg-red-100 text-red-800';
        document.getElementById('response-meta').textContent =
            `Schema ${response.schema_version} · Request ${response.request_id}`;
        document.getElementById('raw-response').textContent =
            JSON.stringify(response, null, 2);

        if (response.status === 'service_failure') {
            throw new Error(response.error.message);
        }

        const data = response.data;
        const gaps = document.getElementById('coverage-list');
        clearNode(gaps);
        for (const gap of data.coverage_gaps) {
            gaps.appendChild(textElement('li', gap));
        }
        document.getElementById('coverage-card').classList.toggle(
            'hidden',
            data.coverage_gaps.length === 0
        );

        const paths = document.getElementById('paths-list');
        clearNode(paths);
        for (const path of data.paths) {
            const card = document.createElement('article');
            card.className = 'border rounded-lg p-4';
            card.appendChild(textElement(
                'h4',
                `${window.CareerNavigationContract.pathTypeLabel(path.path_type)}：${path.target_occupation.name}`,
                'font-semibold'
            ));
            card.appendChild(textElement('p', path.summary, 'mt-2 text-sm text-slate-700'));
            card.appendChild(textElement(
                'p',
                `不确定性：${path.uncertainty.interpretation}`,
                'mt-2 text-xs text-slate-500'
            ));
            paths.appendChild(card);
        }
        document.getElementById('paths-empty').classList.toggle(
            'hidden',
            data.paths.length > 0
        );

        const evidenceList = document.getElementById('evidence-list');
        clearNode(evidenceList);
        for (const evidence of data.evidence) {
            const card = document.createElement('article');
            card.className = 'border rounded-lg p-4';
            card.appendChild(textElement(
                'h4',
                `[${evidence.classification}] 证据等级 ${evidence.evidence_grade}`,
                'font-semibold text-sm'
            ));
            card.appendChild(textElement('p', evidence.claim, 'mt-2 text-sm'));
            card.appendChild(textElement(
                'p',
                `来源：${evidence.source_ids.join('、')}`,
                'mt-2 text-xs text-slate-500'
            ));
            evidenceList.appendChild(card);
        }
        document.getElementById('evidence-empty').classList.toggle(
            'hidden',
            data.evidence.length > 0
        );
        document.getElementById('contract-result').classList.remove('hidden');
    }

    document.getElementById('submit-btn').addEventListener('click', submitQuestion);
    document.getElementById('access-mode').addEventListener('change', updateModeUI);
    updateModeUI();
    </script>
</body>
</html>
